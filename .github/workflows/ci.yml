name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  disable-pages-git:
    name: Disable Pages Git builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Turn off Cloudflare Pages Git auto-builds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/disable-pages-git.sh

  web:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/pages-deploy-layout-test.sh
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_STOCKR_HOST: stockr.currentflowconsulting.org
          NEXT_PUBLIC_APP_URL: https://stockr.currentflowconsulting.org
