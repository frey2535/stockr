name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  cloudflare:
    name: Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write build version
        run: |
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" > public/build-version.json
      - name: Turn off Cloudflare Pages Git auto-builds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/disable-pages-git.sh
      - name: Build OpenNext worker
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_STOCKR_HOST: stockr.currentflowconsulting.org
          NEXT_PUBLIC_APP_URL: https://stockr.currentflowconsulting.org
          NEXT_PUBLIC_STOCKR_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      - name: Bind Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLATFORM_OWNER_PASSWORD: ${{ secrets.PLATFORM_OWNER_PASSWORD }}
          BUILDR_API_URL: ${{ secrets.BUILDR_API_URL }}
          BUILDR_API_KEY: ${{ secrets.BUILDR_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_FLEET: ${{ secrets.STRIPE_PRICE_FLEET }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add GitHub secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (same as The Truth)."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Add GitHub secrets NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY from the Stockr Supabase project."
            exit 1
          fi
          if [ -z "${STRIPE_SECRET_KEY:-}" ] && [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "Warning: add Stripe secrets or GOOGLE_PLAY_SERVICE_ACCOUNT_JSON so production can take paid upgrades."
          fi
          put_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | npx wrangler pages secret put "$name" --project-name=stockr
          }
          put_secret NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          put_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          printf '%s' "1" | npx wrangler pages secret put OPEN_NEXT_CLOUDFLARE --project-name=stockr
          if [ -n "${PLATFORM_OWNER_PASSWORD:-}" ]; then
            put_secret PLATFORM_OWNER_PASSWORD "$PLATFORM_OWNER_PASSWORD"
          fi
          printf '%s' "${BUILDR_API_URL:-https://buildrpm.com}" | npx wrangler pages secret put BUILDR_API_URL --project-name=stockr
          if [ -n "${BUILDR_API_KEY:-}" ]; then
            put_secret BUILDR_API_KEY "$BUILDR_API_KEY"
          fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            put_secret CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          fi
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            put_secret CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          fi
          if [ -n "${STRIPE_SECRET_KEY:-}" ]; then
            put_secret STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          fi
          if [ -n "${STRIPE_WEBHOOK_SECRET:-}" ]; then
            put_secret STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          fi
          if [ -n "${STRIPE_PRICE_PRO:-}" ]; then
            put_secret STRIPE_PRICE_PRO "$STRIPE_PRICE_PRO"
          fi
          if [ -n "${STRIPE_PRICE_FLEET:-}" ]; then
            put_secret STRIPE_PRICE_FLEET "$STRIPE_PRICE_FLEET"
          fi
          if [ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            put_secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          fi
          if [ -n "${RESEND_API_KEY:-}" ]; then
            put_secret RESEND_API_KEY "$RESEND_API_KEY"
          fi
          if [ -n "${RESEND_FROM:-}" ]; then
            put_secret RESEND_FROM "$RESEND_FROM"
          fi
          put_secret STOCKR_BUILD_ID "${GITHUB_SHA}"
          put_secret STOCKR_BUILT_AT "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
      - name: Bind Workers AI for photo identification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/bind-pages-ai.sh
      - name: Deploy vision worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-vision.sh
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/pages-deploy.sh
